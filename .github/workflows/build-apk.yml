name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract ZIP file
        run: |
          echo "Extracting project..."
          unzip -q "Sheko-Ready-To-Upload (1).zip" -d extracted
          echo "Extracted files:"
          ls -la extracted/

      - name: Find Gradle project
        run: |
          echo "Finding project..."
          # Find the directory containing settings.gradle
          PROJ_DIR=$(find extracted -name "settings.gradle" -o -name "settings.gradle.kts" | head -1 | xargs dirname)
          echo "Project found at: $PROJ_DIR"
          echo "$PROJ_DIR" > project_path.txt

      - name: Build APK
        run: |
          PROJ_DIR=$(cat project_path.txt)
          cd "$PROJ_DIR"
          
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            gradle wrapper --gradle-version 8.5
            chmod +x gradlew
            ./gradlew assembleRelease
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheko-APK
          path: extracted/**/build/outputs/apk/release/*.apk
