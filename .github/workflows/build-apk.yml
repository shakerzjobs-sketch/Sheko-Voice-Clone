name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract & Fix Project
        run: |
          echo "=== Extracting ZIP ==="
          unzip -q "Sheko-Ready-To-Upload (1).zip" -d project
          
          echo "=== Project structure ==="
          find project -maxdepth 3 -type f | sort
          
          # Find project root
          SETTINGS=$(find project -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)
          PROJ_DIR=$(dirname "$SETTINGS")
          echo "Project root: $PROJ_DIR"
          
          # Create project-level build.gradle if missing
          if [ ! -f "$PROJ_DIR/build.gradle" ] && [ ! -f "$PROJ_DIR/build.gradle.kts" ]; then
            echo "Creating project-level build.gradle..."
            cat > "$PROJ_DIR/build.gradle" << 'EOF'
plugins {
    id 'com.android.application' version '8.2.2' apply false
}
EOF
          fi
          
          # Fix settings.gradle - add pluginManagement if missing
          if [ -f "$PROJ_DIR/settings.gradle" ]; then
            if ! grep -q "pluginManagement" "$PROJ_DIR/settings.gradle"; then
              echo "Adding pluginManagement to settings.gradle..."
              cat > "$PROJ_DIR/settings.gradle" << 'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "ShekoVoiceClone"
include ':app'
EOF
            fi
          fi
          
          # Fix settings.gradle.kts if exists
          if [ -f "$PROJ_DIR/settings.gradle.kts" ]; then
            if ! grep -q "pluginManagement" "$PROJ_DIR/settings.gradle.kts"; then
              echo "Adding pluginManagement to settings.gradle.kts..."
              cat > "$PROJ_DIR/settings.gradle.kts" << 'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "ShekoVoiceClone"
include(":app")
EOF
            fi
          fi
          
          # Create gradle wrapper if missing
          if [ ! -f "$PROJ_DIR/gradlew" ]; then
            echo "Creating Gradle wrapper..."
            cd "$PROJ_DIR"
            gradle wrapper --gradle-version 8.5
          fi
          
          echo "$PROJ_DIR" > project_dir.txt

      - name: Build APK
        run: |
          PROJ_DIR=$(cat project_dir.txt)
          cd "$PROJ_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheko-APK
          path: project/**/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          
