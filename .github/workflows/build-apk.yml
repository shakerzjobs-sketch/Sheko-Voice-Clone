name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract ZIP
        run: |
          echo "=== Extracting ZIP ==="
          unzip -q "Sheko-Ready-To-Upload (1).zip" -d project
          find project -maxdepth 3 -type f | sort

      - name: Fix Gradle Config
        run: |
          SETTINGS=$(find project -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)
          PROJ_DIR=$(dirname "$SETTINGS")
          echo "Project: $PROJ_DIR"
          
          # Create project build.gradle
          if [ ! -f "$PROJ_DIR/build.gradle" ] && [ ! -f "$PROJ_DIR/build.gradle.kts" ]; then
            echo "plugins { id 'com.android.application' version '8.2.2' apply false }" > "$PROJ_DIR/build.gradle"
          fi
          
          # Fix settings.gradle
          if [ -f "$PROJ_DIR/settings.gradle" ]; then
            if ! grep -q "pluginManagement" "$PROJ_DIR/settings.gradle"; then
              echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > "$PROJ_DIR/settings.gradle"
              echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> "$PROJ_DIR/settings.gradle"
              echo "rootProject.name = 'ShekoVoiceClone'" >> "$PROJ_DIR/settings.gradle"
              echo "include ':app'" >> "$PROJ_DIR/settings.gradle"
            fi
          fi
          
          # Fix settings.gradle.kts
          if [ -f "$PROJ_DIR/settings.gradle.kts" ]; then
            if ! grep -q "pluginManagement" "$PROJ_DIR/settings.gradle.kts"; then
              echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > "$PROJ_DIR/settings.gradle.kts"
              echo 'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }' >> "$PROJ_DIR/settings.gradle.kts"
              echo 'rootProject.name = "ShekoVoiceClone"' >> "$PROJ_DIR/settings.gradle.kts"
              echo 'include(":app")' >> "$PROJ_DIR/settings.gradle.kts"
            fi
          fi
          
          # Create wrapper
          cd "$PROJ_DIR"
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew
          echo "$PROJ_DIR" > ../../project_dir.txt

      - name: Build APK
        run: |
          PROJ_DIR=$(cat project_dir.txt)
          cd "$PROJ_DIR"
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sheko-APK
          path: project/**/build/outputs/apk/release/*.apk
          if-no-files-found: warn
